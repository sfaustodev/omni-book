[workspace]
members = [
    "crates/omninote-core",
    "crates/omninote-gui",
    "crates/omninote-cli",
    "crates/omninote-mcp",
    "crates/omninote-ai",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Juan Fausto <sfaustodev@gmail.com>"]
license = "MIT"
repository = "https://github.com/sfaustodev/omni-book"

[workspace.dependencies]
# Core shared crate
omninote-core = { path = "crates/omninote-core" }

# Common deps
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
slug = "0.1"
open = "5"
anyhow = "1"
thiserror = "1"

# AI layer deps
async-trait = "0.1"

# Core-only deps
meval = "0.2"
pulldown-cmark = "0.12"
lopdf = "0.34"
zip = { version = "2", default-features = false, features = ["deflate"] }

# GUI deps
eframe = "0.29"
egui = "0.29"
egui_commonmark = "0.18"
egui_extras = { version = "0.29", features = ["all_loaders"] }
rfd = "0.15"
notify = "6"

# CLI deps
clap = { version = "4", features = ["derive", "env"] }

# MCP deps
rmcp = { version = "1", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["full"] }
schemars = "1"

[workspace.dependencies.tempfile]
version = "3"

[workspace.dependencies.proptest]
version = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
