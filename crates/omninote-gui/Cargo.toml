[package]
name = "omninote-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "OmniNote desktop GUI (egui)."

[[bin]]
name = "omninote"
path = "src/main.rs"

[dependencies]
omninote-core.workspace = true

# Re-exported from workspace
eframe.workspace = true
egui.workspace = true
egui_commonmark.workspace = true
egui_extras.workspace = true
rfd.workspace = true
notify.workspace = true
fuzzy-matcher.workspace = true

# Shared with core (gui uses serde/chrono/uuid/dirs/open directly)
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
chrono.workspace = true
dirs.workspace = true
uuid.workspace = true
open.workspace = true

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.19.3", default-features = false }

# `cargo bundle --release` → OmniNote.app (see scripts/make-dmg.sh for the .dmg).
[package.metadata.bundle]
name = "OmniNote"
identifier = "dev.sfausto.omninote"
category = "public.app-category.productivity"
short_description = "Native Rust notebook over a filesystem vault of Markdown notes."
copyright = "Copyright © 2026 Juan Fausto. MIT."
osx_minimum_system_version = "11.0"
