[package]
name = "omninote-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "OmniNote desktop GUI (egui)."

[[bin]]
name = "omninote"
path = "src/main.rs"

[dependencies]
omninote-core.workspace = true

# egui stack: app shell, image loaders, native file dialogs, FS watcher, fuzzy search.
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
rfd.workspace = true
notify.workspace = true
fuzzy-matcher.workspace = true
# Opens PDF / non-image embeds in the platform default app.
open.workspace = true
